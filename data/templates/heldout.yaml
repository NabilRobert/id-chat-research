# Held-out templates: the anonymiser is scored on chats made from these,
# once per version. Written and fingerprinted before any recogniser
# existed; the fingerprint is pinned in test_heldout_templates_are_frozen.
# Never edit them to fix a miss: a miss becomes a new dev template.
#
# Slots: {TELEPON} {NIK} {EMAIL} {PLAT} {REKENING} {ID_PESANAN} {NAMA}
# {ALAMAT} are personal data; {NAMA#2} is a second person. {HARGA}
# {PRODUK} {TANGGAL} {KM} {TAHUN} {PROMO} must stay readable. {BANK} is a
# plain filler. All wording is invented for generic shops.

- id: heldout-vehicles-credit
  domain: vehicles
  turns:
    - customer: "sore kak, {PRODUK} yg {TAHUN} masih ready?"
    - agent: "Sore kak, masih ada 1 unit. Dengan kakak siapa nih?"
    - customer: "{NAMA} kak. bisa kredit ga? dp brp"
    - agent: "Bisa kak {NAMA}, DP mulai {HARGA}. Untuk pengajuan saya butuh NIK KTP dan nomor yg aktif ya"
    - customer: "nik {NIK}, hp {TELEPON}"
    - agent: "Siap kak. Email untuk kirim simulasi cicilannya?"
    - customer: "{EMAIL}"
    - agent: "Sudah saya kirim ya kak. Kalau tukar tambah, plat motor lamanya apa?"
    - customer: "{PLAT}, odometer {KM}"
    - agent: "Oke kak, booking fee bisa transfer ke rek {BANK} {REKENING} a.n. dealer ya"

