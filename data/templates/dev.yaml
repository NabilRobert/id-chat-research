- id: dev-insurance-renewal
  domain: insurance
  turns:
    - customer: "polis saya habis {TANGGAL}, mau perpanjang"
    - agent: "Baik kak, nomor polisnya?"
    - customer: "{ID_PESANAN}"
    - agent: "Premi tahun ini {HARGA}, ada promo {PROMO}. Tagihan ke email {EMAIL}?"
    - customer: "betul. bayar transfer ke {BANK} {REKENING} ya kak?"
    - agent: "Betul kak. Nomor hp masih {TELEPON}?"
    - customer: "masih"
