    - customer: "{NIK}"
    - agent: "Terdata a.n. {NAMA}. Alamat untuk survei?"
    - customer: "{ALAMAT}"
    - agent: "Surveyor datang {TANGGAL}, konfirmasi ke {TELEPON}"
