    - agent: "Baik. Nama anak dan NIK nya?"
    - customer: "{NAMA#2}, {NIK#2}"
    - agent: "Pemegang polis?"
    - customer: "saya sendiri {NAMA}, nik {NIK}"
    - agent: "Premi autodebet dari {BANK} {REKENING}? Polis ke email"
    - customer: "iya, {EMAIL}"
