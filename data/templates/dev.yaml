    - agent: "Sekitar {HARGA} kak. Plat mobilnya?"
    - customer: "{PLAT}"
    - agent: "Nama pemilik dan NIK?"
    - customer: "{NAMA} {NIK}"
    - agent: "Penawaran saya kirim ke email dan wa ya"
    - customer: "{EMAIL} / {TELEPON}"

- id: dev-insurance-family
  domain: insurance
  turns:
