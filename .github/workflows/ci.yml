# make check on every push and pull request: ruff (with the complexity
# rules), pyright strict, pytest and gitleaks. No secrets, no model
# downloads, no network beyond installing the pinned tools. Every data set
# the tests use is synthetic and generated in the test run.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REQUIRE_TOOLS: "1"
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans every commit, not only the last one.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      # The exact versions in uv.lock; --locked fails if it no longer matches the pyproject files.
      - run: uv sync --locked --python 3.12
      - name: Install gitleaks, checked against its published checksum
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${archive}$" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - run: make check
