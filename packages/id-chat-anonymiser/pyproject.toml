# The anonymiser: finds personal data in Indonesian chats and replaces it
# with numbered typed placeholders. Also holds the synthetic set generator
# and the scorer that measures it. No network, no Inspect (Phase 2, N1, N7).
[project]
name = "id-chat-anonymiser"
version = "0.1.0"
description = "Removes personal data from Indonesian WhatsApp-style sales chats, measured by what it misses"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "faker==40.44.0",
    "id-chat-records",
    "presidio-analyzer==2.2.366",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "typer==0.27.3",
]

# The NER half (R1, ADR-004): `uv sync --group ner` at the repo root. Kept
# optional so the patterns-only anonymiser installs without torch.
[project.optional-dependencies]
ner = [
    "gliner==0.2.29",
    "huggingface-hub==1.33.0",
    "onnxruntime==1.31.1",
    "tokenizers==0.23.3",
    "torch==2.14.1",
    "transformers==5.16.1",
]

[project.scripts]
id-chat = "id_chat_anonymiser.cli:app"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/id_chat_anonymiser"]
